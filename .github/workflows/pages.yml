# Generated by `verdant-studio publish` from studio/src/Studio/Ops.lex.tex. Do not edit.
name: pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: accept only pull requests made through the API
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          app='afflom-verdant-studio[bot]'
          if [ "$AUTHOR" != "$app" ]; then
            echo "::error::$AUTHOR opened this pull request. Only $app, through the operate workflow, changes this repository."
            exit 1
          fi
          others=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/commits" --paginate --jq ".[] | select(.author.login != \"$app\") | .sha")
          if [ -n "$others" ]; then
            echo "::error::these commits were not made by $app: $others"
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
            target
            ~/.npm
          key: studio-${{ hashFiles('certified/result.json', 'studio/lexlean.lock') }}
      - name: replay the certified bundle, then build its command
        run: |
          set -euo pipefail
          test -x ~/.cargo/bin/lexlean || cargo install --locked --version 0.4.3 lexlean --root ~/.cargo
          ~/.cargo/bin/lexlean production verify-artifact certified
          cargo build --release --manifest-path certified/packages/rust-std/verdant_studio/Cargo.toml --target-dir target
      - name: check, build and publish through the API
        run: |
          set -euo pipefail
          target/release/verdant_studio check
          target/release/verdant_studio build
          target/release/verdant_studio publish
          git diff --exit-code
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: app/.prism/site

  pages:
    if: github.event_name == 'push'
    needs: studio
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
