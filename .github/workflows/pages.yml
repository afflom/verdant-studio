# Generated by `verdant-studio publish` from studio/src/Studio/Ops.lex.tex. Do not edit.
name: pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - id: command
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            target/release/verdant_studio
            target/release/verdant_readers
            target/release/verdant_xml
            target/release/verdant_admit
          key: verdant-studio-${{ hashFiles('certified/**', 'certified-readers/**', 'certified-xml/**', 'certified-admit/**') }}
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.npm
          key: npm-prism-code-0.11.1
      # Restored on every run, not only when certified/ changed: the end-to-end propose-command step below
      # exports with the attested lexlean binary, and a fresh cargo install does not reproduce its hash.
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target/lexlean
          key: lexlean-0.4.3-rust-1.97.0
      - name: replay the certified bundle, then build its command (only when certified/ changed)
        if: steps.command.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          [ "$(sha256sum target/lexlean/bin/lexlean 2>/dev/null | cut -c1-64)" = "$(jq -r .lexlean.executable_sha256 certified/evidence/attestation.json)" ] || { rm -rf target/lexlean; rustup toolchain install 1.97.0 --profile minimal; RUSTFLAGS="--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=cargo-home" cargo +1.97.0 install --locked --version 0.4.3 lexlean --root target/lexlean; }
          target/lexlean/bin/lexlean production verify-artifact certified
          cargo build --release --manifest-path certified/packages/rust-std/verdant_studio/Cargo.toml --target-dir target
          # The reader operations are a second LexLean project with its own bundle, so that each export stays under its limits.
          if [ -d certified-readers ]; then
            target/lexlean/bin/lexlean production verify-artifact certified-readers
            cargo build --release --manifest-path certified-readers/packages/rust-std/verdant_readers/Cargo.toml --target-dir target && rm -f certified-readers/packages/rust-std/verdant_readers/Cargo.lock
          fi
          # The XML readers are a third project with their own bundle, for the same reason.
          if [ -d certified-xml ]; then
            target/lexlean/bin/lexlean production verify-artifact certified-xml
            cargo build --release --manifest-path certified-xml/packages/rust-std/verdant_xml/Cargo.toml --target-dir target && rm -f certified-xml/packages/rust-std/verdant_xml/Cargo.lock
          fi
          # The admission operations are a fourth project with their own bundle, for the same reason.
          if [ -d certified-admit ]; then
            target/lexlean/bin/lexlean production verify-artifact certified-admit
            cargo build --release --manifest-path certified-admit/packages/rust-std/verdant_admit/Cargo.toml --target-dir target && rm -f certified-admit/packages/rust-std/verdant_admit/Cargo.lock
          fi
          # Building may write only target/: a stray file in a bundle fails verify-artifact on the next run (LLV7102).
          if [ -n "$(git status --porcelain -- certified certified-readers certified-xml certified-admit)" ]; then
            echo "::error::building the certified commands left files in certified/, certified-readers/, certified-xml/ or certified-admit/:"
            git status --short -- certified certified-readers certified-xml certified-admit | head -20
            exit 1
          fi
      - name: check, build and publish through the API
        run: |
          set -euo pipefail
          target/release/verdant_studio check
          # Each encoding admitted through admit-translated recorded the reader command that printed it: run it again and fail if the output differs.
          target/release/verdant_readers verify-translations model/admissions.json
          if [ -x target/release/verdant_xml ]; then target/release/verdant_xml verify-translations model/admissions.json; fi
          target/release/verdant_studio build
          target/release/verdant_studio publish
          if ! git diff --quiet; then echo "::error::publish changed $(git diff --name-only | tr '\n' ' '): run every operation through operate, which ends with check, build and publish"; exit 1; fi
      - name: next answers within a second, because operate's advance runs it on every push to main
        run: |
          set -euo pipefail
          best=999999
          for attempt in 1 2 3; do
            start=$EPOCHREALTIME
            target/release/verdant_studio next > target/next.txt || true
            end=$EPOCHREALTIME
            took=$(( (${end/./} - ${start/./}) / 1000 ))
            if [ "$took" -lt "$best" ]; then best=$took; fi
          done
          echo "next took ${best} ms, the best of 3 runs"
          if [ "$best" -gt 1000 ]; then echo "::error::next took ${best} ms, over its 1 s budget: make the reads it repeats cheaper before adding more"; exit 1; fi
      - if: github.event_name == 'pull_request'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.elan
          key: lean-4.32.2-elan-4.1.2
      - name: run propose-command end to end when the pull request changes the API's own workflows
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # The studio check proves the model and replays the certified bundle, but the API's own paths
          # run in these workflows. So a change to them must pass operate's propose-command step itself,
          # on a fixture change, and that export must reproduce certified/ byte for byte.
          git fetch -q --depth=1 origin "$BASE"
          if git diff --quiet FETCH_HEAD -- .github; then echo "the workflows are main's, which main's own runs exercise"; exit 0; fi
          mkdir -p target
          python3 -c 'import yaml; steps = yaml.safe_load(open(".github/workflows/operate.yml"))["jobs"]["operate"]["steps"]; print([step["run"] for step in steps if step.get("name", "").startswith("apply a change")][0])' > target/propose.sh
          d=dev
          none=null
          {
            echo "Fixture change for the studio check's end-to-end run of propose-command."
            echo
            echo "diff --git a/features/suites/e2e.fixture b/features/suites/e2e.fixture"
            echo "new file mode 100644"
            echo "--- /$d/$none"
            echo "+++ b/features/suites/e2e.fixture"
            echo "@@ -0,0 +1 @@"
            echo "+fixture"
          } > target/fixture.patch
          INPUT="$(cat target/fixture.patch)" bash target/propose.sh
          rm -f features/suites/e2e.fixture
          # certified-xml/ and certified-admit/ join the comparison once main holds them: the export that first writes it is the one that adds it.
          bundles="certified certified-readers"
          if [ -n "$(git ls-files certified-xml | head -n 1)" ]; then bundles="$bundles certified-xml"; fi
          if [ -n "$(git ls-files certified-admit | head -n 1)" ]; then bundles="$bundles certified-admit"; fi
          if [ -n "$(git status --porcelain -- $bundles)" ]; then
            echo "::error::operate's propose-command step ran, but its export did not reproduce certified/:"
            git status --short -- $bundles | head -20
            attested=$(git show HEAD:certified/evidence/attestation.json | jq -r .lexlean.executable_sha256); used=$(sha256sum target/lexlean/bin/lexlean | cut -c1-64)
            [ "$attested" = "$used" ] || echo "::error::the export ran with lexlean $used, but certified/ attests lexlean $attested. lexlean is built with rust 1.97.0 and its cargo home remapped, so a different hash means the toolchain or the runner image changed"
            exit 1
          fi
          echo "propose-command applied the fixture, exported again with Lean and reproduced certified/ byte for byte"
      - name: accept only pull requests made through the API (last, so every seal step reports first)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          app='afflom-verdant-studio[bot]'
          if [ "$AUTHOR" != "$app" ]; then
            echo "::error title=provenance::$AUTHOR opened this pull request, not $app through operate. Every seal step above passed; only the provenance gate refuses it."
            exit 1
          fi
          others=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/commits" --paginate --jq ".[] | select(.author.login != \"$app\") | .sha")
          if [ -n "$others" ]; then
            echo "::error::these commits were not made by $app: $others"
            exit 1
          fi
      - if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: app/.prism/site

  pages:
    if: github.event_name == 'push'
    needs: studio
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
