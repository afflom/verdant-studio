# REQ-ENGINE-TRACKING: Verdant Studio tracks Verdant Engine releases. Every hour this runs
# operate stage-engine, which stages the latest release's four registers when they are new
# (advance then ingests them by sha256), and re-cites their admissions once they are ingested.
name: track

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  track:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
