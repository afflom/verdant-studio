# Generated by `verdant-studio publish` from studio/src/Studio/Ops.lex.tex. Do not edit.
# The one way an agent changes this repository: dispatch this workflow with an
# operation of the API. It runs the certified command, and opens a pull request
# as the Verdant Studio GitHub App, which merges it once the studio check passes.
name: operate

# Every push to main runs advance. next (under a second) is the only gate, so a run
# that defers to an open advance pull request always has a successor when that merges.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      args:
        description: 'The operation and its arguments, e.g. "stage-bindings target/input/bindings.jsonl", or "advance" to run every operation that next derives'
        required: true
        default: 'advance'
        type: string
      input:
        description: 'Optional content, written to target/input/<input_name> before the operation runs'
        required: false
        type: string
      input_name:
        description: 'File name for input'
        required: false
        type: string
        default: 'input'

permissions:
  contents: read

# Only operations that write the registers share one group. GitHub keeps one
# pending run per group, so a staging or propose-command run gets its own.
concurrency:
  group: ${{ (startsWith(inputs.args, 'stage-') || startsWith(inputs.args, 'propose-command')) && format('operate-{0}', github.run_id) || 'operate' }}
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - id: app
        uses: actions/create-github-app-token@5d869da34e18e7287c1daad50e0b8ea0f506ce69 # v1.11.0
        with:
          app-id: ${{ vars.VERDANT_STUDIO_APP_ID }}
          private-key: ${{ secrets.VERDANT_STUDIO_APP_KEY }}
      # Main moves about every 10 minutes, and refresh's regeneration of an API change plus its check takes
      # about 12, so an operation merged in that window pushes the change behind main again (#309, #315).
      # refresh keeps a regenerated change ready with its auto-merge set, so this run waits for every such
      # change whose studio check has not failed to merge first, then starts from the new main. It waits at
      # most 10 minutes, so neither queue stalls. A new propose-command waits too, so it never merges ahead of an
      # older change that is being regenerated; revert-merge, the repair of a broken path, never waits.
      - name: wait for the API changes that are next to merge (every operation but revert-merge)
        if: ${{ !startsWith(inputs.args, 'revert-merge ') }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          for try in $(seq 1 20); do
            next=''
            for pr in $(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[] | select(.user.type == "Bot" and (.title | startswith("verdant_studio propose-command")) and .auto_merge != null and (.draft | not)) | .number'); do
              sha=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq .head.sha)
              if [ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs?check_name=studio" --jq '[.check_runs[] | select(.conclusion == "failure")] | length')" = 0 ]; then next="$next #${pr}"; fi
            done
            if [ -z "$next" ]; then exit 0; fi
            echo "waiting for${next} to merge (check $try of 20)"
            sleep 30
          done
          echo "::warning::${next# } still open after 10 minutes, so this run goes on"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - if: inputs.args == 'propose-command'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.elan
          key: lean-4.32.2-elan-4.1.2
      - if: inputs.args == 'propose-command'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target/lexlean
          key: lexlean-0.4.3-rust-1.97.0
      - name: apply a change to the API's own sources, then export it again with Lean (propose-command only)
        if: inputs.args == 'propose-command'
        env:
          INPUT: ${{ inputs.input }}
        run: |
          set -euo pipefail
          mkdir -p target/input
          cat > target/input/change.patch <<< "$INPUT"
          # A patch larger than a dispatch input can carry arrives gzipped and base64-encoded.
          if head -c 4 target/input/change.patch | grep -q '^H4sI'; then base64 -d < target/input/change.patch | gunzip > target/input/change.diff; mv target/input/change.diff target/input/change.patch; fi
          outside=$(git apply --numstat target/input/change.patch | cut -f3 | grep -v -e '^studio/src/' -e '^app/src/Contract.lex.tex$' -e '^app/src/Studio/' -e '^model/ids.toml$' -e '^model/strata.json$' -e '^features/suites/' -e '^README.md$' -e '^readers/' -e '^admit/' -e '^lexlean-workspace.toml$' || true)
          if [ -n "$outside" ]; then echo "::error::propose-command changes only studio/src, app/src/Contract.lex.tex, app/src/Studio, model/ids.toml, model/strata.json, features/suites, README.md, readers, admit and lexlean-workspace.toml, not: $outside"; exit 1; fi
          # readers/lexlean.lock, readers/xml/lexlean.lock and admit/lexlean.lock are generated, and the export below writes them again.
          git apply --exclude=readers/lexlean.lock --exclude=readers/xml/lexlean.lock --exclude=admit/lexlean.lock target/input/change.patch
          # The owner reads this pull request, so its body leads with the proposer's own account (the prose
          # before the first diff), then the definitions it changes. Checked before the export, which takes minutes.
          awk 'index($0, "diff --git") == 1 { exit } { print }' target/input/change.patch > target/summary.md
          if ! grep -q '[[:alnum:]]' target/summary.md; then
            echo "::error::propose-command needs a plain-language account before the patch: what changes and why, the requirement or decision it serves, what it unblocks, and the risk and how it was verified"
            exit 1
          fi
          # The export refuses Lean output holding an absolute path (LLV7006) only at its end, so refuse an added
          # string literal with a slash at a token boundary before a name character here, in seconds.
          if grep '^+[^+]' target/input/change.patch | grep '"' | grep -E "(^|[[:space:]\"'\`([{<,;=])/[[:alnum:]_.]" > target/absolute.txt; then
            echo "::error::LLV7006: these added lines put a slash at a token boundary, which the export refuses as an absolute path (write >/dev/null with no space):"
            cat target/absolute.txt
            exit 1
          fi
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL -o target/elan.tgz https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz
            echo "f81c2e48c1588d4612cd2c8851947898a45ac8d72748a07dff3a5694f1cf589b  target/elan.tgz" | sha256sum -c -
            tar -xzf target/elan.tgz -C target
            target/elan-init -y --no-modify-path --default-toolchain leanprover/lean4:v4.32.2
          fi
          export PATH="$HOME/.elan/bin:$PATH"
          test -d "$HOME/.elan/toolchains/leanprover--lean4---v4.32.2" || elan toolchain install leanprover/lean4:v4.32.2
          [ "$(sha256sum target/lexlean/bin/lexlean 2>/dev/null | cut -c1-64)" = "$(jq -r .lexlean.executable_sha256 certified/evidence/attestation.json)" ] || { rm -rf target/lexlean; rustup toolchain install 1.97.0 --profile minimal; RUSTFLAGS="--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=cargo-home" cargo +1.97.0 install --locked --version 0.4.3 lexlean --root target/lexlean; }
          ll="$PWD/target/lexlean/bin/lexlean"
          # The one export, shared with refresh and run end to end by the studio check.
          if ! bash .github/scripts/export.sh "$ll" target/export.log; then
            grep -m 20 'error' target/export.log | sed 's/^/::error::/' || echo "::error::the Lean export failed without an error line; its last lines follow"
            tail -n 40 target/export.log
            exit 1
          fi
          git diff -U0 -- studio/src app/src/Contract.lex.tex app/src/Studio readers/src readers/xml/src admit/src | awk 'index($0, "+++ b") == 1 { file = substr($0, 7) } index($0, "@@") == 1 { parts = split($3, at, ","); start = substr(at[1], 2); count = (parts > 1) ? at[2] : 1; print file " " ((count > 0) ? start + count - 1 : start) }' > target/hunks.txt
          {
            cat target/summary.md
            echo
            echo "### Definitions this adds or changes"
            echo
            {
              while read -r file line; do head -n "$line" "$file" | { grep '^  name: ' || true; } | tail -n 1; done < target/hunks.txt
              { git diff -U0 -- studio/src app/src/Contract.lex.tex app/src/Studio readers/src readers/xml/src admit/src | grep '^[+]  name: ' || true; } | cut -c2-
            } | awk '{ sub("^  name: ", "- `"); sub(",$", "`"); print }' | sort -u
            echo
            slash=/
            echo "<details><summary>Export and files<${slash}summary>"
            echo
            echo "Exported again with Lean as $(basename studio/.lexlean/production/*/). The studio check replays it, then runs check, build and publish."
            echo
            echo "Lean phases by wall time in seconds, longest first (the export fails at 240 of the 300 s limit):"
            echo
            echo '```'
            head -n 8 target/export.log.phases || true
            echo '```'
            echo
            echo '```'
            git diff --stat -- studio/src app/src/Contract.lex.tex app/src/Studio model/ids.toml model/strata.json features/suites README.md readers admit lexlean-workspace.toml
            echo '```'
            echo
            echo "<${slash}details>"
          } > target/operation.txt
      - id: command
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            target/release/verdant_studio
            target/release/verdant_readers
            target/release/verdant_xml
            target/release/verdant_admit
          key: verdant-studio-${{ hashFiles('certified/**', 'certified-readers/**', 'certified-xml/**', 'certified-admit/**') }}
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.npm
          key: npm-prism-code-0.11.1
      - if: steps.command.outputs.cache-hit != 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: target/lexlean
          key: lexlean-0.4.3-rust-1.97.0
      - name: replay the certified bundle, then build its command (only when certified/ changed)
        if: steps.command.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          [ "$(sha256sum target/lexlean/bin/lexlean 2>/dev/null | cut -c1-64)" = "$(jq -r .lexlean.executable_sha256 certified/evidence/attestation.json)" ] || { rm -rf target/lexlean; rustup toolchain install 1.97.0 --profile minimal; RUSTFLAGS="--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=cargo-home" cargo +1.97.0 install --locked --version 0.4.3 lexlean --root target/lexlean; }
          target/lexlean/bin/lexlean production verify-artifact certified
          cargo build --release --manifest-path certified/packages/rust-std/verdant_studio/Cargo.toml --target-dir target
          # The reader operations are a second LexLean project with its own bundle, so that each export stays under its limits.
          if [ -d certified-readers ]; then
            target/lexlean/bin/lexlean production verify-artifact certified-readers
            cargo build --release --manifest-path certified-readers/packages/rust-std/verdant_readers/Cargo.toml --target-dir target && rm -f certified-readers/packages/rust-std/verdant_readers/Cargo.lock
          fi
          # The XML readers are a third project with their own bundle, for the same reason.
          if [ -d certified-xml ]; then
            target/lexlean/bin/lexlean production verify-artifact certified-xml
            cargo build --release --manifest-path certified-xml/packages/rust-std/verdant_xml/Cargo.toml --target-dir target && rm -f certified-xml/packages/rust-std/verdant_xml/Cargo.lock
          fi
          # The admission operations are a fourth project with their own bundle, for the same reason.
          if [ -d certified-admit ]; then
            target/lexlean/bin/lexlean production verify-artifact certified-admit
            cargo build --release --manifest-path certified-admit/packages/rust-std/verdant_admit/Cargo.toml --target-dir target && rm -f certified-admit/packages/rust-std/verdant_admit/Cargo.lock
          fi
      - name: run the operation, then check, build and publish through the API, as the studio check does
        env:
          ARGS: ${{ inputs.args || 'advance' }}
          INPUT: ${{ inputs.input }}
          INPUT_NAME: ${{ inputs.input_name }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail -f
          # A GitHub API call that fails (a 5xx answer or a dropped connection) is tried again,
          # at most 4 tries, 2, 4 and 8 seconds apart, so a transient error never stops the queue.
          gh() { local try out; for try in 1 2 3 4; do if out=$(command gh "$@"); then if [ -n "$out" ]; then echo "$out"; fi; return 0; fi; if [ "$try" -lt 4 ]; then echo "::warning::gh $1 failed (try $try of 4)" >&2; sleep $((2 ** try)); fi; done; return 1; }
          # read-* operations run in their reader project's command when it is built (the XML ones in verdant_xml), the admission operations in verdant_admit, every other in the studio command.
          vs() { case "$1" in admit|admit-encoding|admit-registry|admit-translated|propose-encoding) if [ -x target/release/verdant_admit ]; then target/release/verdant_admit "$@"; return; fi;; read-xml|read-xsd|read-xsd-components) if [ -x target/release/verdant_xml ]; then target/release/verdant_xml "$@"; return; fi;; read-*) if [ -x target/release/verdant_readers ]; then target/release/verdant_readers "$@"; return; fi;; esac; target/release/verdant_studio "$@"; }
          # An App pull request whose files already hold on main has nothing left to merge,
          # so it is closed; the propose-command ones change the API and stay open until they merge.
          for pr in $(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[] | select(.user.type == "Bot" and (.title | startswith("verdant_studio ")) and (.title | startswith("verdant_studio propose-command") | not)) | .number'); do
            files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}/files?per_page=100" --jq '.[].filename')
            if [ -n "$files" ] && git fetch -q --depth=1 origin "pull/${pr}/head" && git diff --quiet HEAD FETCH_HEAD -- $files; then
              gh api --silent -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${pr}" -f state=closed
              echo "::notice::closed #${pr}: every file it changes already holds on main"
            fi
          done
          if [ "$ARGS" = advance ]; then
            gh api "repos/${GITHUB_REPOSITORY}/rules/branches/main" > target/rules.json
            gate=$(target/release/verdant_studio merge-gate target/rules.json)
            for pr in $(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[] | select(.title == "verdant_studio advance") | .number'); do
              if [ "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq .mergeable_state)" = dirty ]; then
                gh api --silent -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${pr}" -f state=closed
                echo "::notice::closed advance pull request #${pr}: it conflicts with main, and this run supersedes it"
              # Where main lets an App pull request merge itself, one without auto-merge was left by a
              # run that failed after opening it, so nothing would ever merge it: this run supersedes it.
              elif [ "$gate" = merge ] && [ "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.auto_merge != null')" = false ]; then
                gh api --silent -X PATCH "repos/${GITHUB_REPOSITORY}/pulls/${pr}" -f state=closed
                echo "::notice::closed advance pull request #${pr}: auto-merge was never enabled on it, and this run supersedes it"
              else
                echo "::notice::advance pull request #${pr} is open; its merge changes model/authorities.toml, which runs advance again"
                exit 0
              fi
            done
          fi
          if [ -n "$INPUT" ] && [ "$ARGS" != propose-command ]; then
            case "$INPUT_NAME" in */*|.*|'') echo "input_name must be a plain file name" >&2; exit 1;; esac
            mkdir -p target/input; cat > "target/input/$INPUT_NAME" <<< "$INPUT"
          fi
          if [ "$ARGS" = propose-command ]; then
            # A change to a reader re-derives the encodings it printed before the studio check replays them.
            if [ -x target/release/verdant_readers ]; then
              readmitted=$(bash .github/scripts/readmit.sh target/release/verdant_readers; if [ -x target/release/verdant_xml ]; then bash .github/scripts/readmit.sh target/release/verdant_xml; fi)
              if [ -n "$readmitted" ]; then
                { echo; echo "### Encodings admitted again"; echo; echo "This change alters what a reader prints for these admitted encodings, so each was admitted again through read-admit with the command and citation its row records:"; echo; sed 's/^/- /' <<< "$readmitted"; } >> target/operation.txt
              fi
            fi
            cat target/operation.txt
          elif [ "$ARGS" = advance ]; then
            : > target/operation.txt
            last=''
            skipped=''
            # next prints one operation it can dispatch, or else the lines that say why the
            # queue waits: each begins with "waiting", and none is dispatched.
            while op=$(target/release/verdant_studio next $skipped) && [ -n "$op" ] && [ "${op#waiting}" = "$op" ]; do
              if [ "$op" = "$last" ]; then echo "::error::$op did not settle"; exit 1; fi
              if vs $op > target/attempt.txt 2>&1; then
                tee -a target/operation.txt < target/attempt.txt
                last=$op
              else
                cat target/attempt.txt
                binding=${op#* }
                echo "::warning::$op was refused; the other bindings continue"
                echo "refused: $op" >> target/operation.txt
                git clean -fdq -- "authorities/$(basename "$binding" .json)"
                skipped="$skipped $binding"
                # The refusal becomes a Studio.Error.Observation in the model (REQ-SELF-HEALING).
                vs record-error target/attempt.txt "$(date -u -Iseconds)" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" $op | tee -a target/operation.txt
              fi
            done
            t0=$EPOCHREALTIME
            target/release/verdant_studio next $skipped > target/next.txt || true
            echo "next: $(echo "$EPOCHREALTIME - $t0" | bc) s for one call over $(find model -name '*.json*' | wc -l) model files" | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "${op#waiting}" != "$op" ]; then echo "$op" > target/waiting.txt; else : > target/waiting.txt; fi
            for pr in $(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" --jq '.[] | select(.title | startswith("verdant_studio propose-command")) | .number'); do
              echo "waiting merge: #${pr} changes the API, and merges once the studio check passes" >> target/waiting.txt
            done
            if [ -s target/waiting.txt ]; then tee -a target/operation.txt < target/waiting.txt >> "$GITHUB_STEP_SUMMARY"; fi
          elif [ "${ARGS#revert-merge }" != "$ARGS" ]; then
            # The repair of a merge that broke the API's own path. Dispatched from a branch at the last
            # good main commit, it reverts the merge on main as the App, and merges once the studio check passes.
            merge=${ARGS#revert-merge }
            case "$merge" in *[!0-9a-f]*|'') echo "::error::revert-merge takes the full hex id of a merge commit on main"; exit 1;; esac
            git fetch -q origin main
            git checkout -q -B revert origin/main
            if ! git merge-base --is-ancestor "$merge" origin/main; then echo "::error::$merge is not on main"; exit 1; fi
            git revert -m 1 --no-commit "$merge"
            cargo build -q --release --manifest-path certified/packages/rust-std/verdant_studio/Cargo.toml --target-dir target
            if [ -d certified-readers ]; then cargo build -q --release --manifest-path certified-readers/packages/rust-std/verdant_readers/Cargo.toml --target-dir target && rm -f certified-readers/packages/rust-std/verdant_readers/Cargo.lock; fi
            if [ -d certified-xml ]; then cargo build -q --release --manifest-path certified-xml/packages/rust-std/verdant_xml/Cargo.toml --target-dir target && rm -f certified-xml/packages/rust-std/verdant_xml/Cargo.lock; fi
            if [ -d certified-admit ]; then cargo build -q --release --manifest-path certified-admit/packages/rust-std/verdant_admit/Cargo.toml --target-dir target && rm -f certified-admit/packages/rust-std/verdant_admit/Cargo.lock; fi
            { echo "Revert $merge, a merge that broke the API's own path"; echo; echo "**What changes and why.** This reverts the merge $merge on main $(git rev-parse --short origin/main), made by the App from the last good main commit, so the repair needs no bypass."; echo; echo '```'; git diff --cached --stat -- studio/src app/src model features README.md .github; echo '```'; } > target/operation.txt
          else
            vs $ARGS | tee target/operation.txt
          fi
          target/release/verdant_studio check
          target/release/verdant_studio build
          target/release/verdant_studio publish
      - name: open a pull request as the Verdant Studio app
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
          ARGS: ${{ inputs.args || 'advance' }}
        run: |
          set -euo pipefail
          # A GitHub API call that fails (a 5xx answer or a dropped connection) is tried again,
          # at most 4 tries, 2, 4 and 8 seconds apart, so a transient error never stops the queue.
          gh() { local try out; for try in 1 2 3 4; do if out=$(command gh "$@"); then if [ -n "$out" ]; then echo "$out"; fi; return 0; fi; if [ "$try" -lt 4 ]; then echo "::warning::gh $1 failed (try $try of 4)" >&2; sleep $((2 ** try)); fi; done; return 1; }
          git add -A
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          id=$(gh api "users/${SLUG}[bot]" --jq .id)
          git -c user.name="${SLUG}[bot]" -c user.email="${id}+${SLUG}[bot]@users.noreply.github.com" commit -q -F - <<MSG
          verdant_studio $ARGS

          $(cat target/operation.txt)
          MSG
          branch="studio/${GITHUB_RUN_ID}"
          if ! git push origin "HEAD:refs/heads/${branch}" 2> target/push.err; then
            grep -E 'GH013|error|rejected|path:' target/push.err | head -20 | sed 's/^/::error::/'
            exit 1
          fi
          title="verdant_studio $ARGS"
          if [ "$ARGS" = propose-command ]; then title="verdant_studio propose-command: $(grep -m 1 '[[:alnum:]]' target/summary.md | awk '{ sub("^[# ]*", ""); print }')"; fi
          if [ "${ARGS#revert-merge }" != "$ARGS" ]; then title="verdant_studio propose-command: Revert ${ARGS#revert-merge }, a merge that broke the API's own path"; fi
          # REST, not GraphQL: run 45646779790 lost its pull request to four GraphQL errors.
          # Opening is idempotent: run 45649684941 opened #263 although its call reported an error, and the retry then failed on "already exists".
          # So each try first looks for an open pull request from this branch, and an existing one counts as opened.
          pr=""
          for try in 1 2 3 4; do
            pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${branch}" --jq '.[0].number // empty')
            if [ -n "$pr" ]; then break; fi
            if pr=$(command gh api "repos/${GITHUB_REPOSITORY}/pulls" -f head="$branch" -f base=main -f title="$title" -F body=@target/operation.txt --jq .number) && [ -n "$pr" ]; then break; fi
            pr=""
            echo "::warning::opening the pull request failed (try $try of 4)"
            sleep $((2 ** try))
          done
          if [ -z "$pr" ]; then echo "::error::no pull request could be opened for $branch"; exit 1; fi
          echo "opened #${pr}"
          gh api "repos/${GITHUB_REPOSITORY}/rules/branches/main" > target/rules.json
          # A change to the API itself (propose-command, revert-merge) merges as every App pull request does:
          # the owner automated these approvals (2026-11-26), so the studio check, which runs the API's own
          # end-to-end propose run, is its gate. refresh keeps its auto-merge while it regenerates it.
          if [ "$(target/release/verdant_studio merge-gate target/rules.json)" = merge ]; then
            gh pr merge "$pr" --auto --squash --delete-branch
          else
            echo "::notice::main does not require the studio check, so this pull request waits for the owner's merge"
          fi
