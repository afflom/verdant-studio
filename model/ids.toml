id = "VS-01"
level = "build"
suite = "admission"
statement = "A requirement citation resolves exactly when its requirement is in the requirements register"
theorems = ["Studio.Admission.req_resolves_exactly_when_registered"]

[[id]]
id = "VS-02"
level = "build"
suite = "admission"
statement = "A standard citation resolves exactly when its authority is registered and its catalog row, if it names one, is registered"
theorems = ["Studio.Admission.std_resolves_exactly_when_cited_authority_registered"]

[[id]]
id = "VS-03"
