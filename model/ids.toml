# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file, and
# `prism-code build` writes it; `prism-code check` refuses one that is not that
# generation byte for byte (R1).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and proved by Lean's kernel
#   open       measured and reported, never asserted
#
# Every row has a scenario in `features/suites/`, tagged with its ID and level
# (R3). A `build` row names its evidence in `theorems`: each a theorem of the
# model in `app/src/`, written `Module.name`. `prism-code check` refuses the row
# unless every theorem it names is stated by the model and proved by Lean's
# kernel, within its declared axioms, in that same check. There is no "pending"
# state: a capability that is not built does not get a row.
#
# A row that specifies a public failure declares it (R5):
#
#   failure   the exact response the application gives when it refuses, as text
#   negative  the ID of the `build` row whose theorems prove the refusal's
#             condition; this row's own ID when the row is that claim
#
# Its scenario is also tagged `@rejects`, and `prism-code build` refuses the row
# unless it replays at least one acceptance vector whose response is exactly the
# `failure` text.
#
# A capability starts with a row here, then its scenario, then the theorem and
# the acceptance vectors that are its evidence, in the order `AGENTS.md` sets out.

spec = "template/2"

[[id]]
id = "TC-01"
level = "build"
suite = "contract"
statement = "The checker answers conformant exactly when every universal policy file's observed label equals its locked label"
theorems = ["Contract.conformant_decides"]

[[id]]
id = "TC-02"
level = "build"
suite = "contract"
statement = "The checker answers invalid request to a request that is neither exactly one locked and one observed label for each universal policy file nor a Studio guard or stage-bindings request shorter than 192 bytes, and no request is read as both"
theorems = ["Contract.accepts_exactly_a_request", "Contract.forms_are_disjoint"]
failure = "invalid request"
negative = "TC-02"

